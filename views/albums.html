{% extends "_base.html" %} {% block header %}
<h1>Albums</h1>
{% endblock %} {% block content %}
<form id="search-form">
  <input
    id="search-input"
    name="query"
    type="text"
    placeholder="Enter an album title or an artist"
  />
  <button id="search-button">Search</button>
</form>
<ul id="album-search-list">
  {%for album in albums%}
  <li>{{album.title}}</li>
  {% endfor%}
</ul>
<ul id="itemList"></ul>
{% endblock %}
